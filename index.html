<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mural 56 - Ultra Simple</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#F7F5FF;color:#1E1B4B;padding:16px}
h1{font-size:22px;margin:0 0 6px}.sub{font-size:12px;color:#6B7280;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:white;border:1px solid #E9D5FF;border-radius:16px;padding:10px}
.ttl{font-weight:800}.badge{font-size:10px;background:#F5F3FF;border:1px solid #DDD6FE;padding:3px 8px;border-radius:999px;color:#5B21B6}
.slot{border:1px dashed #DDD6FE;border-radius:10px;padding:6px;margin-top:6px;min-height:70px;position:relative;background:#FBF9FF}
.slot img{width:100%;height:60px;object-fit:cover;border-radius:6px}
.up{position:absolute;inset:0;opacity:0;cursor:pointer}
.btn{border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;background:#4C1D95;color:white;margin:4px}
</style></head>
<body>
<h1>IE Alfonso Builes Correa - 56 Salones PRUEBA</h1>
<div class="sub">Prejardín 1-4, Jardín 1-4, Transición 1-4, 1° a 11° con 4 grupos (6-1,6-2,6-3,6-4) • Coord. Elkin Bedoya</div>
<div style="margin-bottom:12px">
<button class="btn" onclick="localStorage.clear();location.reload()">🔄 Borrar todo y recargar 56</button>
<span id="cnt"></span>
</div>
<div id="grid" class="grid"></div>
<script>
const GRUPOS=[];
["Prejardín","Jardín","Transición","Primero","Segundo","Tercero","Cuarto","Quinto","Sexto","Séptimo","Octavo","Noveno","Décimo","Undécimo"].forEach(g=>{
 for(let i=1;i<=4;i++){ GRUPOS.push(g+' '+String(i).padStart(2,'0')); }
});
function loadImgs(){ try{ return JSON.parse(localStorage.getItem('mural-56-ULTRA')||'{}'); }catch{ return {}; } }
function saveImgs(o){ localStorage.setItem('mural-56-ULTRA', JSON.stringify(o)); }
let imgs = loadImgs();
function render(){
 document.getElementById('cnt').textContent = GRUPOS.length+' grupos cargados';
 let grid=document.getElementById('grid'); grid.innerHTML='';
 GRUPOS.forEach(nombre=>{
   let id=nombre.toLowerCase().replace(/\s+/g,'-');
   let card=document.createElement('div'); card.className='card';
   let slots=['Horario','Cumple','Aseo','Acuerdos'].map((lab,idx)=>{
     let key=id+'-'+idx;
     let has=imgs[key];
     return '<div class="slot">'+(has?'<img src="'+has+'">':'<div style="height:60px;display:grid;place-items:center;color:#9CA3AF">📷 '+lab+'</div>')+'<div style="font-size:10px;font-weight:700;margin-top:4px">'+lab+'</div><input type="file" accept="image/*" class="up" onchange="subir(\''+key+'\',this)"></div>';
   }).join('');
   card.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><div class="ttl">'+nombre+'</div><span class="badge">'+nombre.split(' ')[0]+'</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">'+slots+'</div>';
   grid.appendChild(card);
 });
}
function comprimir(file){return new Promise((res,rej)=>{let r=new FileReader(); r.onload=e=>{let img=new Image(); img.onload=()=>{let c=document.createElement('canvas'); let max=800,w=img.width,h=img.height; if(w>max){h=h*max/w; w=max;} if(h>max){w=w*max/h; h=max;} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',0.7));}; img.onerror=rej; img.src=e.target.result;}; r.onerror=rej; r.readAsDataURL(file);});}
async function subir(key,input){let f=input.files[0]; if(!f) return; let d=await comprimir(f); imgs[key]=d; saveImgs(imgs); render();}
render();
</script>
</body></html>
