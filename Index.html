<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mural 56 Salones - FIX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#F7F5FF;color:#1E1B4B}
.hdr{background:linear-gradient(135deg,#2E1065,#4C1D95 50%,#6D28D9);color:white;padding:16px 14px;position:sticky;top:0;z-index:10}
.esc{width:70px;height:70px;border-radius:50%;background:white;padding:5px;border:3px solid #E9D5FF;object-fit:contain}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px}
.btn-w{background:white;color:#4C1D95}.btn-r{background:#FEE2E2;border:1px solid #FECACA;color:#991B1B}
.main{max-width:1300px;margin:14px auto;padding:0 12px 30px}
.bar{display:flex;gap:8px;flex-wrap:wrap;background:white;border:1px solid #E9D5FF;border-radius:16px;padding:10px}
.inp{flex:1;min-width:200px;padding:11px 14px;border-radius:999px;border:1px solid #DDD6FE;background:#FBF9FF;font-weight:600;outline:none}
.sel{padding:11px 12px;border-radius:999px;border:1px solid #DDD6FE;background:white;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:16px}
.card{background:white;border:1px solid #E9D5FF;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(91,33,182,.07)}
.head{padding:12px;display:flex;justify-content:space-between;gap:8px}.badge{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;border:1px solid}
.b-pre{background:#FEF3C7;border-color:#FDE68A;color:#92400E}.b-prim{background:#DBEAFE;border-color:#BFDBFE;color:#1E40AF}.b-sec{background:#F5F3FF;border-color:#DDD6FE;color:#5B21B6}.b-med{background:#DCFCE7;border-color:#86EFAC;color:#14532D}
.ttl{font-weight:800;font-size:17px;margin-top:5px}.meta{font-size:11px;color:#7C3AED;font-weight:700}
.del{width:32px;height:32px;border-radius:50%;border:1px solid #FECACA;background:#FFF5F5;color:#EF4444;cursor:pointer;display:grid;place-items:center}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 10px}.slot{border:1.5px dashed #DDD6FE;border-radius:12px;padding:6px;min-height:104px;background:#FBF9FF;position:relative;overflow:hidden}.slot.has{border-style:solid;background:white;border-color:#C4B5FD}.slot img{width:100%;height:78px;object-fit:cover;border-radius:8px}.emp{height:78px;display:grid;place-items:center;color:#A1A1AA;font-size:24px;background:#FFF;border-radius:8px}.lab{font-size:10px;font-weight:800;color:#5B21B6;margin-top:5px}.up{position:absolute;inset:0;opacity:0;cursor:pointer}.prog{height:6px;background:#EDE9FF;border-radius:999px;overflow:hidden;margin-top:8px}.barr{height:100%;width:0%;background:linear-gradient(90deg,#4C1D95,#8B5CF6)}
</style></head><body>

function parse(n){let t=(n||'').trim(); if(!t) return {orden:99,num:0,grado:'Otro',nivel:'Otro'}; let m=t.match(/^(\d{1,2})\s*[-]\s*(\d{1,2})$/); if(m){let g=parseInt(m[1],10),nu=parseInt(m[2],10); let map={1:'Primero',2:'Segundo',3:'Tercero',4:'Cuarto',5:'Quinto',6:'Sexto',7:'Séptimo',8:'Octavo',9:'Noveno',10:'Décimo',11:'Undécimo'}; let gr=map[g]||'Grado '+g; return {orden:ORDEN[String(g)]??99,num:nu,grado:gr,nivel:NIVEL[gr]||'Otro'};} let grRaw=t; let nu=0; let mm=t.match(/^(.+?)\s+0*(\d+)\s*$/); if(mm){grRaw=mm[1].trim(); nu=parseInt(mm[2],10)||0;} let key=grRaw.toLowerCase(); let orden=ORDEN[key]??99; let mapN={"prejardin":"Prejardín","prejardín":"Prejardín","jardin":"Jardín","jardín":"Jardín","transicion":"Transición","transición":"Transición","primero":"Primero","segundo":"Segundo","tercero":"Tercero","cuarto":"Cuarto","quinto":"Quinto","sexto":"Sexto","septimo":"Séptimo","séptimo":"Séptimo","octavo":"Octavo","noveno":"Noveno","decimo":"Décimo","décimo":"Décimo","undecimo":"Undécimo","undécimo":"Undécimo"}; let gr=mapN[key]||grRaw; return {orden,num:nu,grado:gr,nivel:NIVEL[gr]||'Otro'};}
function makeBase(){let arr=[]; let cfg=[["Prejardín",4],["Jardín",4],["Transición",4],["Primero",4],["Segundo",4],["Tercero",4],["Cuarto",4],["Quinto",4],["Sexto",4],["Séptimo",4],["Octavo",4],["Noveno",4],["Décimo",4],["Undécimo",4]]; cfg.forEach(function(it){let g=it[0],c=it[1]; for(let i=1;i<=c;i++){let nn=String(i).padStart(2,'0'); arr.push({id:g.toLowerCase()+'-'+nn+'-'+Date.now()+i, nombre:g+' '+nn, imgs:{horario:null,cumple:null,aseo:null,acuerdos:null}});}}); return arr;}
function load(){try{let raw=localStorage.getItem(KEY); if(raw){data=JSON.parse(raw); if(data.length<30){data=makeBase(); save();}} else {data=makeBase(); save();}}catch(e){data=makeBase();}}
function save(){try{localStorage.setItem(KEY, JSON.stringify(data));}catch(e){alert('Memoria llena');}}
function resetTodo(){if(confirm('¿Borrar memoria vieja y mostrar los 56 grupos de fábrica?')){localStorage.clear(); data=makeBase(); save(); render(); alert('Listo: '+data.length+' grupos');}}
function render(){let q=(document.getElementById('q').value||'').toLowerCase(); let fN=document.getElementById('fN').value; let fG=document.getElementById('fG').value; let list=[...data].sort((a,b)=>{let pa=parse(a.nombre), pb=parse(b.nombre); if(pa.orden!==pb.orden) return pa.orden-pb.orden; return pa.num-pb.num;}); if(fN!=='Todos') list=list.filter(s=>parse(s.nombre).nivel===fN); if(fG!=='Todos') list=list.filter(s=>parse(s.nombre).grado===fG); if(q) list=list.filter(s=>s.nombre.toLowerCase().includes(q)); document.getElementById('cnt').textContent=list.length+' / '+data.length+' grupos'; let box=document.getElementById('box'); box.innerHTML=''; let niveles=["Preescolar","Primaria","Secundaria","Media"]; let groups={}; list.forEach(s=>{let niv=parse(s.nombre).nivel; (groups[niv]=groups[niv]||[]).push(s);}); niveles.forEach(niv=>{if(!groups[niv]) return; let sec=document.createElement('div'); sec.style.marginTop='18px'; sec.innerHTML='<div style="font-weight:800;margin:0 0 8px 2px">'+niv+' • '+groups[niv].length+' grupos</div><div class="grid"></div>'; box.appendChild(sec); let grid=sec.querySelector('.grid'); groups[niv].forEach(s=>{let p=parse(s.nombre); let comp=Object.values(s.imgs).filter(Boolean).length; let pct=Math.round(comp/4*100); let bcls=p.nivel==='Preescolar'?'b-pre':p.nivel==='Primaria'?'b-prim':p.nivel==='Secundaria'?'b-sec':'b-med'; let slots=SLOTS.map(sl=>{let has=s.imgs[sl.k]; return '<div class="slot '+(has?'has':'')+'">'+(has?'<img src="'+has+'">':'<div class="emp">'+sl.i+'</div>')+'<div class="lab">'+sl.i+' '+sl.l+'</div><input type="file" accept="image/*" class="up" onchange="upFoto(\''+s.id+'\',\''+sl.k+'\',this)"></div>';}).join(''); let card=document.createElement('div'); card.className='card'; card.innerHTML='<div class="head"><div><div class="badge '+bcls+'">'+p.nivel.toUpperCase()+' • '+p.grado.toUpperCase()+'</div><div class="ttl">'+s.nombre+'</div><div class="meta">'+comp+'/4</div><div class="prog"><div class="barr" style="width:'+pct+'%"></div></div></div><button class="del" onclick="delGrupo(\''+s.id+'\')">🗑️</button></div><div class="slots">'+slots+'</div>'; grid.appendChild(card);});}); if(list.length===0) box.innerHTML='<div style="text-align:center;padding:30px;color:#9CA3AF">Sin resultados. Dale a Resetear y mostrar 56</div>';}
function compImg(file){return new Promise((res,rej)=>{let r=new FileReader(); r.onload=e=>{let img=new Image(); img.onload=()=>{let c=document.createElement('canvas'); let max=900,w=img.width,h=img.height; if(w>max){h=h*max/w; w=max;} if(h>max){w=w*max/h; h=max;} c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); res(c.toDataURL('image/jpeg',0.72));}; img.onerror=rej; img.src=e.target.result;}; r.onerror=rej; r.readAsDataURL(file);});}
async function upFoto(id,slot,inp){let f=inp.files[0]; if(!f) return; let d=await compImg(f); let s=data.find(x=>x.id===id); s.imgs[slot]=d; save(); render();}
function addPrompt(){let name=prompt('Nombre (Ej: 6-3 o Prejardín 5):'); if(!name) return; let norm=name.trim(); let m=norm.match(/^(\d{1,2})\s*[-]\s*(\d{1,2})$/); if(m){let g=parseInt(m[1],10), n=parseInt(m[2],10); let map={1:'Primero',2:'Segundo',3:'Tercero',4:'Cuarto',5:'Quinto',6:'Sexto',7:'Séptimo',8:'Octavo',9:'Noveno',10:'Décimo',11:'Undécimo'}; norm=(map[g]||g+'°')+' '+String(n).padStart(2,'0');} if(data.some(s=>s.nombre.toLowerCase()===norm.toLowerCase())){alert('Ya existe'); return;} let nid=norm.toLowerCase().replace(/\s+/g,'-')+'-'+Date.now(); data.push({id:nid,nombre:norm,imgs:{horario:null,cumple:null,aseo:null,acuerdos:null}}); data.sort((a,b)=>{let pa=parse(a.nombre), pb=parse(b.nombre); if(pa.orden!==pb.orden) return pa.orden-pb.orden; return pa.num-pb.num;}); save(); render();}
function delGrupo(id){if(!confirm('¿Eliminar?')) return; data=data.filter(x=>x.id!==id); save(); render();}
function exportWA(){let list=[...data].sort((a,b)=>{let pa=parse(a.nombre), pb=parse(b.nombre); if(pa.orden!==pb.orden) return pa.orden-pb.orden; return pa.num-pb.num;}); let comp=list.filter(s=>Object.values(s.imgs).filter(Boolean).length===4).length; let txt='🏫 *MURAL 56 SALONES*%0A📊 '+comp+'/'+list.length+' completos%0A%0A'+list.map(s=>{let c=Object.values(s.imgs).filter(Boolean).length; return (c===4?'✅':c>0?'🟡':'⬜')+' '+s.nombre+' ('+c+'/4)';}).join('%0A'); window.open('https://wa.me/?text='+txt,'_blank');}
load(); render();
</script></body></html>
